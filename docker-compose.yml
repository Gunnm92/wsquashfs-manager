# wsquashfs-manager — déploiement Unraid à côté de SteamBox.
# Mot de passe obligatoire (écoute réseau) : WSQUASHFS_MGR_PASSWORD dans un
# fichier .env à côté de ce fichier (jamais commité).
services:
  wsquashfs-manager:
    image: registry.elfenn.eu/wsquashfs-manager:latest
    build: .
    container_name: wsquashfs-manager
    restart: unless-stopped
    user: "99:100"                    # nobody:users = arcade de SteamBox
    environment:
      - TZ=Europe/Paris
      - WSQUASHFS_MGR_PASSWORD=${WSQUASHFS_MGR_PASSWORD:?mot de passe requis}
    ports:
      - "8765:8765"
    volumes:
      # Ludothèque Batocera (mêmes images que SteamBox)
      - /mnt/user/Game/Batocera/roms:/roms
      # Sauvegardes du lanceur dans SteamBox (couche overlay de chaque jeu) :
      # taille, réinitialisation, report des valeurs de registre
      - /mnt/user/appdata/steambox/.local/share/wsquashfs/saves:/saves
      # État : file de tâches, caches, couches overlay temporaires
      - /mnt/user/appdata/wsquashfs-manager:/data
    # Voir les processus de SteamBox : un jeu en cours (WINEPREFIX) bloque
    # la reconstruction de son image, comme dans le lanceur
    pid: host
    # Reconstruction sans extraction : squashfuse + fuse-overlayfs
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
