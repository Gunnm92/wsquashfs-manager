# Règles « tel fichier → tel réglage » (SPEC § 2.5)
# Éditable, versionné avec l'application. Évaluées dans l'ordre.
#
# `when` : conditions (toutes doivent être vraies)
#   file: glob           — un fichier correspond (glob sans « / » : nom du
#                          fichier, n'importe où ; avec « / » : chemin complet)
#   not_file: glob|[globs] — aucun fichier ne correspond
#   all_files: [globs]   — tous les fichiers présents
#   imports: [dlls]      — (« .dll » facultatif, casse ignorée) toutes les DLL importées par l'exécutable
#   imports_any: [dlls]  — au moins une DLL importée
#   not_imports: [dlls]  — aucune de ces DLL importée
#   prefix: batocera|proton|other|none
#   arch: win32|win64    — d'après system.reg (#arch=)
#   exe_bits: 32|64
#   large_address_aware: true|false
#   strings_any: [str]   — chaînes trouvées dans l'exécutable
#   exe_name_glob: glob
#   dll_override: {dll: valeur} — réglage DllOverrides du registre
#   tekno_version_below: "x.y" — TeknoParrot de version connue et inférieure
#
# Les conditions inconnues sont refusées au chargement.
# `then` : une clé, un fichier à ajouter, ou un avertissement
#   variables dans value/file : {exe_dir} (dossier de l'exécutable), {exe_name}
# `confidence` : high | medium | low
rules:
  - name: dxvk-d3d
    when:
      imports_any: [d3d9, d3d10, d3d10core, d3d11, dxgi]
    then:
      key: DXVK
      value: "1"
    justification: "le jeu utilise Direct3D 9-11 : DXVK le traduit en Vulkan (sans lui, Wine passe par OpenGL, rendu logiciel sous NVIDIA dans SteamBox)"
    confidence: high

  - name: vkd3d-d3d12
    when:
      imports: [d3d12]
    then:
      key: VKD3D
      value: "1"
    justification: "Direct3D 12 via Vulkan (ex. Pinball FX)"
    confidence: high

  - name: d7vk-ddraw
    when:
      imports: [ddraw]
    then:
      key: D7VK
      value: "1"
    justification: "jeux DirectDraw"
    confidence: high

  - name: opengl-seul
    when:
      imports: [opengl32]
      not_imports: [d3d9, d3d10, d3d11, dxgi, d3d12, ddraw]
    then:
      warning: "OpenGL seul : DXVK n'aurait pas d'effet"
    justification: "rendu OpenGL natif"
    confidence: high

  - name: hidraw-sony
    when:
      file: "libScePad*.dll"
    then:
      key: HIDRAW
      value: "1"
      warning: "DualSense gérée nativement (libScePad) : HIDRAW=1, et désactiver Steam Input pour ce jeu — sinon Steam prend la manette et la présente en manette Xbox"
    justification: "portage Sony (ex. Until Dawn) ; steam_api, présent dans presque tous les jeux, n'y change rien"
    confidence: medium

  - name: hidraw-sony-integre
    when:
      strings_any: [DualSense]
      imports: [hid]
    then:
      key: HIDRAW
      value: "1"
      warning: "DualSense gérée par le jeu lui-même (accès HID direct) : HIDRAW=1, et désactiver Steam Input pour ce jeu"
    justification: "portage Sony sans libScePad séparée (ex. Until Dawn : « DualSense » dans l'exécutable + import de hid.dll)"
    confidence: medium

  - name: exe-32-bit-limite
    when:
      exe_bits: 32
      large_address_aware: false
    then:
      warning: "exécutable 32 bits sans large address aware : limite de 2 Go"
    justification: "rien de spécial depuis la correction de la pile ; ex. GTI Club"
    confidence: high

  - name: konami-fakeping
    when:
      file: "libavs-win32.dll"
      imports: [dinput8]
    then:
      file: "{exe_dir}/dinput8.dll"
      warning: "relais fakeping (tools/fakeping-dinput8) à poser à côté de l'exécutable, avec \"dinput8\"=\"native,builtin\" dans user.reg, clé Software\\Wine\\AppDefaults\\{exe_name}\\DllOverrides — jamais par ENV=WINEDLLOVERRIDES"
    justification: "Konami e-amusement : ping ICMP de libavs-win32 ; ex. Yu-Gi-Oh! DT6, GTI Club"
    confidence: medium

  - name: tekno-d3dx9-43
    when:
      exe_name_glob: "*TeknoParrot*"
      dll_override: {d3dx9_43: native}
    then:
      warning: "d3dx9_43 natif (Microsoft) dans le prefix : mettre \"*d3dx9_43\"=\"builtin\" dans le registre"
    justification: "Yu-Gi-Oh! DT6"
    confidence: medium

  - name: tekno-ancien
    when:
      exe_name_glob: "*TeknoParrot*"
      tekno_version_below: "1.0.0.140"
    then:
      warning: "TeknoParrot ancien : proposer la mise à jour (anti-débogage)"
    justification: "ex. Yu-Gi-Oh! ; version de référence à ajuster"
    confidence: medium

  - name: jvs-emu
    when:
      file: "JVSEmu*.dll"
    then:
      warning: "JVSEmu détecté : manette obligatoire au lancement"
    justification: "ex. GTI Club"
    confidence: high

  - name: demul-pistolet
    when:
      file: "DemulShooter.exe"
    then:
      warning: "pistolet Demul : vérifier config.ini (périphérique d'origine)"
    justification: "ex. Castlevania"
    confidence: high

  - name: prefix-proton
    when:
      prefix: proton
    then:
      warning: "prefix Proton : le lanceur choisit Proton tout seul, PROTON= seulement pour forcer une version"
    justification: "prefix Proton → Proton par défaut du lanceur"
    confidence: high

  - name: prefix-batocera-win32
    when:
      prefix: batocera
      arch: win32
    then:
      key: ARCH
      value: "win32"
    justification: "system.reg #arch=win32"
    confidence: high

  - name: sauvegardes-batocera
    when:
      prefix: batocera
      file: "drive_c/users/*/documents/my games/*"
    then:
      warning: "sauvegardes dans « Mes documents/My Games » : conservées par le lanceur dans le dossier de sauvegardes"
    justification: "sauvegardes connues sur prefix Batocera"
    confidence: medium
